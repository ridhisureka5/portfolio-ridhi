services:
  - type: web
    name: ridhi-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
